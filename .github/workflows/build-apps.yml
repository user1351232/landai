name: 앱 빌드 (윈도우·안드로이드)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src-tauri/**"
      - "scripts/**"
      - "tests_js/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-apps.yml"

permissions:
  contents: write

concurrency:
  group: build-apps
  cancel-in-progress: true

jobs:
  test:
    name: 분석 로직 시험
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  android:
    name: 안드로이드 APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - run: npm run vendor
      - run: npm run write-keys
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}
      - run: npx cap add android
      - name: 위치 권한 추가
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk landai-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: landai-android
          path: landai-android.apk

  windows:
    name: 윈도우 설치 파일
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run vendor
      - run: npm run write-keys
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}
      - run: npx tauri icon app/icons/icon.png
      - run: npx tauri build
      - name: 설치 파일 모으기
        shell: bash
        run: cp src-tauri/target/release/bundle/nsis/*-setup.exe landai-windows-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: landai-windows
          path: landai-windows-setup.exe

  release:
    name: 다운로드 링크 갱신
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 이전 빌드 지우기
        run: gh release delete app-latest --yes --cleanup-tag --repo ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 앱 최신 빌드
          prerelease: true
          make_latest: false
          body: |
            자동 빌드 (커밋 ${{ github.sha }})
            - 안드로이드: landai-android.apk
            - 윈도우: landai-windows-setup.exe
          files: |
            dist/landai-android.apk
            dist/landai-windows-setup.exe
