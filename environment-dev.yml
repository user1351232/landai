# conda 환경 정의. 윈도우·맥·리눅스 모두 같은 파일로 설치합니다.
#   conda env create -f environment-dev.yml
# (웹 배포는 requirements.txt 만 씁니다. 이 파일 이름을 environment.yml 로 바꾸면
#  Streamlit Cloud 가 이 파일을 먼저 골라 무거운 라이브러리까지 설치하니 바꾸지 마세요.)
name: landai
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas>=2.0
  - pyyaml
  - python-dotenv
  - requests
  - openpyxl
  - geopandas>=0.14
  - pyogrio
  - shapely>=2.0
  - pyproj>=3.6
  - rasterio>=1.3
  - streamlit>=1.40
  - folium>=0.17
  - pip
  - pip:
      - streamlit-folium>=0.22
